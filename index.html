<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 털기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  /* 레이아웃: 휴대폰 폭 한 줄 앱. 냉장고 속처럼 차가운 바탕 위에 고추장 빨강 하나만 강조 */
  --bg:#E9F0EE; --surface:#FFFFFF; --ink:#14221E; --muted:#5A6B65; --line:#D2DDD8; --dim:#7A8B84;
  --accent:#D4382A; --accent-ink:#FFFFFF; --ok:#1C8456; --yolk:#F2B632; --soft:#F3F7F5;
  --display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1715; --surface:#19231F; --ink:#E9F1EE; --muted:#9BAFA8; --line:#2B3A35; --dim:#647A72;
    --accent:#F05A44; --accent-ink:#1A0C09; --ok:#4FC690; --yolk:#F2B632; --soft:#141D1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#19231F; --ink:#E9F1EE; --muted:#9BAFA8; --line:#2B3A35; --dim:#647A72;
  --accent:#F05A44; --accent-ink:#1A0C09; --ok:#4FC690; --yolk:#F2B632; --soft:#141D1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* 한국어는 낱말 중간이 아니라 띄어쓰기에서 줄바꿈 (긴 영문·숫자만 넘칠 때 끊음) */
body{word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(130px + var(--dock, 0px));min-height:100%}
html{scroll-padding-bottom:calc(110px + var(--dock, 0px))}

/* 머리 */
.top{padding:22px 0 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:-.5px}
.brand h1 span{color:var(--accent)}
.brand{align-items:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps button{width:100%;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.steps button::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.steps button[aria-current="step"]{color:var(--ink)}
.steps button[aria-current="step"]::before{background:var(--accent)}
.steps button.done::before{background:var(--ink)}
.steps button:disabled{cursor:default}

h2{word-break:keep-all;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;margin:8px 0 4px;text-wrap:balance}
.lead{margin:0 0 16px;color:var(--muted);font-size:15px}
h3{font-size:15px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
h3 small{font-weight:500;color:var(--muted);font-size:13px}

/* 재료 고르기 */
.addform{display:flex;gap:8px;margin-bottom:8px}
.addform input{flex:1;min-width:0;height:48px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);padding:0 14px}
.addform input::placeholder{color:var(--muted)}
.addform button{height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0 0 18px;min-height:20px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted);flex:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip[aria-pressed="true"]::before{border-color:var(--yolk);background:var(--yolk);box-shadow:inset 0 0 0 2.5px var(--ink)}
.chip.custom::after{content:"×";font-weight:800;margin-left:2px;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.tile-pic{display:block;width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tile-pic .ico{width:100%;height:100%;display:block}
.tile-n{font-size:13px;font-weight:600;line-height:1.25;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.tile[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1.5px var(--ink) inset}
.tile[aria-pressed="true"] .tile-n{font-weight:800}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--yolk);color:#14221E;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.tile.custom[aria-pressed="true"]::after{content:"×";background:var(--ink);color:var(--bg)}
.ico-txt{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-weight:800;font-size:20px;color:var(--muted);background:var(--soft)}
.ages{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.ages::-webkit-scrollbar{display:none}
.age{flex:none;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:7px 11px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.age b{font-size:14px}
.age small{font-size:11px;color:var(--muted)}
.age[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.age[aria-checked="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.agenote{margin:10px 0 0;font-size:13px;background:color-mix(in srgb,var(--yolk) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--yolk) 50%,var(--line));border-radius:10px;padding:9px 11px}
.agenote b{margin-right:4px}
.spice{display:inline-flex;align-items:center;gap:1px;font-size:12px}
.spice svg{width:14px;height:14px}
.spice svg path{fill:none;stroke:var(--dim);stroke-width:1.4}
.spice svg.on path{fill:var(--accent);stroke:var(--accent)}
.spice svg path.stem{fill:none!important;stroke:var(--ok)!important;stroke-width:1.6;stroke-linecap:round}
.spice b{margin-left:5px;font-weight:700;color:var(--muted)}
.spice.big svg{width:17px;height:17px}

.topnav{display:flex;gap:6px}
.topnav button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.topnav button span{color:var(--accent)}
.topnav button b{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.titlerow h2{min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.favbtn{flex:none;white-space:nowrap;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;margin-top:4px}
.favbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.made{font-size:13px;font-weight:700;color:var(--ok)}
.favmark{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.card{position:relative}
.ingtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.servs{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.servs button{border:0;background:transparent;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;color:var(--muted)}
.servs button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.block .ing li.row{grid-template-columns:36px minmax(0,1fr) auto auto}
.row-s{min-width:42px;padding:3px 7px!important;white-space:nowrap}
button.row-s.shop{background:transparent;color:var(--accent);border:1.5px solid var(--accent);font-size:11px;font-weight:800;border-radius:6px}
button.row-s.shop.on{background:var(--accent);color:var(--accent-ink)}
.row-n small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ghost{border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:11px;font-weight:800;font-size:14px}
.cta.wide{width:100%;margin-top:4px}
h2.oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:nowrap}
h2.oneline.wrap{white-space:normal;text-wrap:balance;overflow:visible}
.rbtn{align-self:flex-start;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:7px 14px;white-space:nowrap}
.rbtn:disabled{opacity:.6}
.tbtn{display:inline-flex;align-items:center;gap:4px;margin:6px 0 0;border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:800}
ol.how li > span{display:flex;flex-direction:column;align-items:flex-start}
.timers{position:fixed;left:0;right:0;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 16px;pointer-events:none}
body.has-bar .timers{bottom:92px}
.timer{pointer-events:auto;position:relative;overflow:hidden;width:100%;max-width:488px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t-l{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .t-t{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.timer button{border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800}
.timer i{position:absolute;left:0;bottom:0;height:3px;background:var(--yolk)}
.timer.done{background:var(--accent);color:var(--accent-ink);animation:pulse 1s infinite}
.timer.done button{color:var(--accent-ink);border-color:var(--accent-ink)}
@keyframes pulse{50%{transform:scale(1.02)}}
.yt{padding:10px;align-items:center}
.yt-thumb{position:relative;flex:none;width:112px;border-radius:10px;overflow:hidden}
.yt-thumb .art{aspect-ratio:16/9}
.yt-thumb.yt-r{aspect-ratio:16/9;background:var(--soft)}
.yt-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.yt-thumb i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:27px;border-radius:8px;background:var(--accent);z-index:2}
.yt-thumb i::after{content:"";position:absolute;left:15px;top:7px;border-left:11px solid var(--accent-ink);border-top:6.5px solid transparent;border-bottom:6.5px solid transparent}
.yt-h{font-weight:inherit}
.yt-t{display:flex;flex-direction:column;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;min-width:0;flex:1 1 0}
.yt{min-width:0}
.chk{position:relative;width:24px;height:24px;flex:none}
.chk input{position:absolute;opacity:0;width:24px;height:24px;margin:0;cursor:pointer}
.chk span{display:block;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px}
.chk input:checked + span{background:var(--ok);border-color:var(--ok)}
.chk input:checked + span::after{content:"✓";color:#fff;font-weight:800;display:block;text-align:center;line-height:20px;font-size:14px}
.chk input:focus-visible + span{outline:3px solid var(--yolk);outline-offset:2px}
.block .ing.shop-l li.row{grid-template-columns:24px 36px minmax(0,1fr) auto auto}
.cp{display:inline-block;min-width:42px;padding:3px 7px;font-size:11px;font-weight:800;text-align:center;white-space:nowrap;text-decoration:none;color:#fff;background:#E4002B;border-radius:6px}
.buy{display:inline-flex;gap:4px}
@media (max-width:400px){.buy{flex-direction:column;gap:3px}.buy .cp{padding:2px 6px}}
.cp.kl{background:#5F0080}
.qbox{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px;background:var(--soft)}
.qbox.start{padding:10px 12px}
.qhint{font-size:13px;color:var(--muted);margin:0 0 8px}
.qstart{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;min-height:48px;min-width:0;padding:7px 8px;border-radius:12px;font-weight:800;font-size:14px;line-height:1.25;text-decoration:none;color:#fff;background:#E4002B;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.qbtn small{font-size:12px;font-weight:700;opacity:.9}
.qbtn.s-kl,.qgo.s-kl{background:#5F0080;border-color:#5F0080;color:#fff}
.qgo.s-cp{background:#E4002B;border-color:#E4002B;color:#fff}
.qgo{white-space:normal;display:block;text-align:center;text-decoration:none;margin-top:10px}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.qlist{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0}
.qlist li{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.qlist li.done{color:var(--muted);text-decoration:line-through}
.qlist li.now{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.qact{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.qact .textbtn{font-size:13px}
.cpnote{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.mthumb{display:block;width:36px;height:36px;border-radius:9px;overflow:hidden}
.mthumb .art{aspect-ratio:1/1;height:100%}
.linkish{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none}}

.brand{flex-wrap:wrap;row-gap:10px}
.topnav{flex-wrap:wrap}
.topnav b.n2{background:var(--ink)}
.topnav button[aria-current="page"] b.n2{background:var(--bg);color:var(--ink)}
.alhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.alhead h3{color:var(--accent);margin:0}
.alhead h3.off{color:var(--muted)}
.alnone{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 2px;cursor:pointer}
.alnone input{width:20px;height:20px;accent-color:var(--ink);margin:0}
.alsub{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ages.al{flex-wrap:wrap;overflow:visible;gap:7px}
/* 누가 먹나요: 5개 버튼을 한 줄에 같은 너비로 (좁은 폰에서는 버튼 안에서 글자가 줄바꿈) */
.ages.agew{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;overflow:visible}
.agew .age{min-width:0;padding:7px 2px;align-items:center;justify-content:center;text-align:center;word-break:keep-all;overflow-wrap:break-word}
.agew .age b{font-size:13px;line-height:1.2}
.agew .age small{font-size:10.5px;line-height:1.2;margin-top:1px}
.agew .nw{white-space:nowrap}
[data-fs="1"] .agew .age b{font-size:12px}
[data-fs="1"] .agew .age small{font-size:9.5px}
[data-fs="2"] .agew .age b{font-size:11px}
[data-fs="2"] .agew .age small{font-size:9px}
.al .age{padding:7px 13px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.al .age b{font-size:15px;font-weight:800}
.al .age[aria-pressed="true"] b::before{content:"✓ "}
.al.off .age{opacity:.38;filter:grayscale(1);border-color:var(--line);cursor:not-allowed}
.al.off .age b{text-decoration:line-through;text-decoration-thickness:1.5px}
.al .age[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who{gap:10px}
.who h3{flex-wrap:wrap;row-gap:2px}
.who h3 + .ages{margin-top:-2px}
.tile[hidden],section[hidden]{display:none!important}
.pill.sub{background:color-mix(in srgb,var(--yolk) 30%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--yolk) 70%,var(--line))}
.subn{display:block;font-size:12px;font-weight:600;color:#9A6A00;margin-top:2px}
:root[data-theme="dark"] .subn{color:var(--yolk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subn{color:var(--yolk)}}
.aln{display:block;font-size:12px;font-weight:700;color:var(--accent);margin-top:2px}
.ing li.row.al .row-n{text-decoration:line-through;text-decoration-color:var(--accent)}
.nut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nut div{min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center}
.nut b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;max-width:100%;white-space:nowrap}
@media(max-width:380px){.nut b{font-size:18px}}
@media(max-width:330px){.nut b{font-size:16px}}
.nut span{font-size:12px;color:var(--muted)}
.nabar{height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.nabar i{display:block;height:100%;background:var(--accent)}
textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:10px 12px;resize:vertical}
textarea:focus{border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1.5px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 0;font-weight:800}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.planact{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.planact .ghost:disabled,.planact .cta:disabled{opacity:.45}
.planact .cta,.planact .ghost{white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.topnav button{flex-wrap:wrap;row-gap:0}
.ing.plan .prow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ing.plan .prow:first-child{border-top:0}
.pday{font-family:var(--display);font-weight:400;font-size:20px;color:var(--accent)}
.pitems{display:flex;flex-wrap:wrap;gap:6px}
.pitems>*{min-width:0;max-width:100%;overflow-wrap:anywhere}
.pchip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px}
.pchip .linkish{font-size:14px}
.px{border:0;background:none;width:24px;height:24px;border-radius:50%;font-weight:800;color:var(--muted)}
.tbtn.dark{background:var(--ink);color:var(--bg);margin:0}
.tbtn.big{font-size:17px;padding:10px 18px;margin-top:18px}

.rchip.mine{background:var(--surface);box-shadow:0 0 0 2px currentColor inset}
button.rchip.lnk{cursor:pointer}

.ntab .nn{color:var(--muted);font-weight:400}

 ["식초 2큰술, 설탕 1큰술, 소금 1/2작은술을 섞어 설탕을 녹여요.", "따뜻한 밥에 배합초와 통깨를 넣고 주걱으로 자르듯 섞어 식혀요.", "유부는 끓는 물에 30초 데쳐 기름을 빼고, 물 100ml, 간장 2큰술, 설탕 반 큰술에 3분 졸여 식혀요. 시판 조미유부는 이 과정을 건너뛰어요.", "당근, 오이, 단무지는 잘게 다져 밥에 섞어요. 기름을 뺀 참치를 섞어도 좋아요.", "유부의 물기를 살짝 짜고 밥을 한 숟가락씩 채워요."],

 ["오이, 당근, 파프리카, 양상추, 깻잎은 5cm 길이로 가늘게 채 썰어요.","새우는 끓는 물에 2분 데쳐 반으로 저미고, 게맛살은 결대로 찢어요.","간장 2큰술, 식초 2큰술, 설탕 1큰술 반, 물 2큰술을 섞어 소스를 만들어요. 땅콩버터 1큰술을 풀면 고소한 땅콩 소스가 되고, 연겨자 1작은술을 섞으면 톡 쏘는 겨자 소스가 돼요.","라이스페이퍼를 따뜻한 물에 2~3초 담갔다 꺼내 접시에 펼쳐요.","채소와 새우, 게맛살, 파인애플을 올리고 양옆을 접어 돌돌 말아요.","소스에 찍어 먹어요."],

 ["끓는 물 2L에 소금 1큰술을 넣고 스파게티면을 봉지 시간보다 1분 짧게 삶아요. 면수 한 컵을 남겨 둬요.","마늘은 편으로, 양파는 잘게 썰고 버섯과 베이컨은 한입 크기로 썰어요.","팬에 올리브유 2큰술을 두르고 마늘과 양파를 약불에서 3분 볶아 향을 내요.","다진 돼지고기나 베이컨, 버섯을 넣고 중불에서 고기가 익을 때까지 볶아요.","토마토소스와 설탕 1/2작은술을 넣고 5분 끓여요. 홍합이 있으면 깨끗이 씻어 이때 넣고 입이 벌어질 때까지 끓여요. 면과 면수 3~4큰술을 넣고 1분 섞어요.","소금과 후추로 간을 맞추고 치즈와 파슬리가루를 뿌려요."],

 ["무가당 두유에 견과류 2큰술, 통깨 1큰술(검은깨를 쓰면 고소한 흑임자 콩물이 돼요), 소금 1/2작은술을 넣고 믹서로 곱게 갈아 냉장고에 차게 둬요. 믹서가 없으면 두유에 소금만 넣어도 돼요.","오이는 가늘게 채 썰고 토마토는 한입 크기로 썰어요. 계란은 삶아 반으로 잘라요.","소면을 끓는 물에 3분 30초 삶아 찬물에 비벼 헹구고 물기를 빼요.","그릇에 면을 담고 차가운 콩물을 부어요.","오이, 토마토, 계란을 올리고 소금이나 설탕으로 입맛에 맞춰요."],

 ["수박은 반으로 잘라 숟가락이나 스쿱으로 동그랗게 떠내고, 남은 속은 체에 걸러 즙을 내요.", "참외, 배, 키위는 한입 크기로 썰어요.", "수박즙에 물 300ml, 꿀 2큰술, 설탕 1큰술을 섞어 국물을 만들어요. 우유를 넣으면 부드러운 우유 화채가 돼요.", "큰 그릇에 과일을 담고 국물을 부어요.", "얼음을 띄워 차갑게 먹어요."],

 ["찹쌀가루 1컵, 설탕 2큰술, 소금 한 꼬집에 물 160ml를 넣고 멍울 없이 풀어요.","전자레인지용 그릇에 담아 랩을 씌우고 구멍을 몇 개 뚫어요.","전자레인지에 1분 30초 돌린 뒤 꺼내 잘 젓고, 다시 1분 30초 돌려요. 반투명하고 쫀득해질 때까지 반복해요.","도마에 전분을 넉넉히 뿌리고 반죽을 올려 한 김 식힌 뒤 6등분해요.","반죽을 납작하게 펴 딸기나 다진 견과류(팥앙금도 좋아요)를 올리고 오므려 동그랗게 빚어요.","겉에 전분이나 콩가루를 묻혀 붙지 않게 해요. 떡은 목에 걸리기 쉬우니 아이에게는 작게 잘라 주고 먹는 동안 지켜봐 주세요."],

 ["훈제오리는 기름 없이 달군 팬에 앞뒤로 1분씩 데우듯 구워 기름을 빼요.", "양파는 얇게 채 썰어 찬물에 담가 매운맛을 빼고, 파프리카와 오이는 가늘게 채 썰어요. 부추는 5cm 길이로 썰어요.", "연겨자 1작은술, 간장 1큰술, 식초 1큰술, 설탕 1큰술, 물 1큰술을 섞어 겨자 소스를 만들어요.", "깻잎이나 상추에 오리고기와 채소를 올려 싸요. 사진처럼 포두부로 싸도 좋아요(포두부는 콩으로 만들어 대두 알레르기가 있으면 빼요).", "겨자 소스에 찍어 먹어요."],

 ["닭고기(닭다리살)는 한입 크기로 썰어요.","고추장 2큰술, 고춧가루 2큰술, 간장 2큰술, 설탕 1큰술, 다진 마늘 1큰술을 섞어 양념장을 만들고 닭고기를 버무려 10분 재워요.","양배추는 큼직하게, 고구마와 당근은 도톰하게, 양파는 채 썰고 대파와 깻잎은 4cm 길이로 썰어요.","넓은 팬에 식용유를 두르고 고구마, 당근, 양배추를 깔고 양념한 닭고기와 떡을 올려 중불에서 볶아요.","닭고기가 익고 고구마가 젓가락으로 쑥 들어가면 양파, 대파, 깻잎을 넣고 2분 더 볶아요. 눌어붙으면 물을 조금씩 넣어요.","치즈를 올려 녹이면 치즈닭갈비가 돼요. 남은 양념에 밥을 볶아 먹어도 좋아요."],

 ["찜갈비는 찬물에 1시간 담가 핏물을 빼요. 중간에 물을 한두 번 갈아요.", "끓는 물에 갈비를 5분 데친 뒤 건져 찬물에 헹궈 기름과 불순물을 씻어요.", "간 배 1/2개, 간장 6큰술, 설탕 2큰술, 올리고당 2큰술, 다진 마늘 1큰술, 참기름 1큰술, 후추를 섞어 양념장을 만들어요. 배가 없으면 설탕을 1큰술 더 넣어요.", "냄비에 갈비와 양념장, 물 600ml를 넣고 뚜껑을 덮어 중약불에서 40분 끓여요.", "큼직하게 썬 무와 당근, 버섯, 대추를 넣고 20분 더 졸여요. 무가 투명해지면 다 익은 거예요.", "양파와 대파를 넣고 국물을 끼얹어 가며 5분 졸이면 완성이에요."],

 ["돼지고기(통삼겹이나 앞다리살)는 찬물에 20분 담가 핏물을 빼요.", "냄비에 고기가 잠길 만큼 물을 붓고 된장 1큰술을 풀어요. 양파, 대파, 마늘, 생강, 월계수잎, 후추를 넣고 끓여요.", "끓으면 고기를 넣고 뚜껑을 덮어 중불에서 40~50분 삶아요. 젓가락으로 찔러 핏물이 안 나오면 다 익은 거예요.", "불을 끄고 10분 그대로 두었다가 건져 한 김 식혀요. 그래야 고기가 부서지지 않아요.", "0.5cm 두께로 썰어 김치, 새우젓, 상추와 함께 내요."],

 ["애호박, 양파, 감자, 버섯, 두부는 1cm 크기로 잘게 썰어요.", "뚝배기나 작은 냄비에 참기름을 두르고 다진 돼지고기와 다진 마늘을 1분 볶아요. 고기가 없으면 생략해도 돼요.", "감자, 양파, 애호박, 버섯을 넣고 1분 볶은 뒤 된장 3큰술, 고추장 1/2큰술, 고춧가루 1/2큰술을 넣어 섞어요.", "물 200ml를 붓고 중약불에서 저어 가며 10분 자작하게 졸여요. 두부는 마지막 3분에 넣어요.", "청양고추와 대파를 넣고 불을 꺼요. 밥에 비비거나 찐 양배추·상추에 싸 먹어요. 짜니까 조금씩 곁들여요."],

// 저장된 값은 형식이 깨져 있을 수 있으니 항목마다 검사해서 쓸 수 있는 것만 살린다
function clean(s){
  /* 예전 재료 이름 바꾸기(달걀→계란 등)는 재료 이름 칸에만 적용한다. 메모·요리 이름 같은 글은 건드리지 않는다 */
  try { const RN = {"달걀":"계란","요구르트":"요거트","토르티야":"또띠아","머스터드":"머스타드","프라이":"후라이"};
    const mig = x => typeof x === "string" ? (x === "햄" ? "스팸" : x.replace(/달걀|요구르트|토르티야|머스터드|프라이/g, m => RN[m])) : x;
    const migA = v => Array.isArray(v) ? v.map(mig) : v;
    s = Object.assign({}, s, { sel: migA(s.sel), custom: migA(s.custom), recent: migA(s.recent), dislike: migA(s.dislike),
      shop: Array.isArray(s.shop) ? s.shop.map(x => x && typeof x === "object" ? Object.assign({}, x, { n: mig(x.n) }) : x) : s.shop }); } catch(e){}
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  const strs = (v, ok) => Array.isArray(v) ? [...new Set(v.filter(x => typeof x === "string" && x && (!ok || ok(x))))] : [];
  const names = new Set(RECIPES.map(r => r.name));
  const okName = x => names.has(x) || /^ext:\d{1,7}$/.test(x);
  const out = { sel: strs(s.sel, x => KNOWN.includes(x)), custom: strs(s.custom).map(x => x.slice(0, 12)), fresh: false,
    age: Number.isInteger(s.age) && s.age >= 0 && s.age <= 4 ? s.age : 4,
    serv: [1,2,3,4].includes(s.serv) ? s.serv : 2,
    shop: [], fav: strs(s.fav, okName), log: {}, recent: strs(s.recent, x => KNOWN.includes(x)).slice(0, 8),
    allergy: strs(s.allergy, x => x in ALLERGY), alnone: s.alnone === true, dislike: strs(s.dislike).map(x => x.slice(0, 12)).slice(0, 30), tmax: [0, 15, 30, 60].includes(s.tmax) ? s.tmax : 0, often: s.often !== false, isort: ["asc", "desc"].includes(s.isort) ? s.isort : "", iflat: s.iflat === true, bst: [1, 2, 3, 4].includes(s.bst) ? s.bst : 2, memo: {}, plan: [[],[],[],[],[],[],[]], meal: [], ramen: strs(s.ramen, x => /^[a-z]{2,12}$/.test(x)).slice(0, 40), rfav: strs(s.rfav, x => /^[a-z]{2,12}$/.test(x)).slice(0, 40), rmemo: {},
    theme: ["auto","light","dark"].includes(s.theme) ? s.theme : "auto", fs: [0,1,2].includes(s.fs) ? s.fs : 0,
    goal: Number.isFinite(s.goal) ? Math.min(4000, Math.max(1000, Math.round(s.goal / 100) * 100)) : 2000 };
  if (Array.isArray(s.shop)) { const seen = new Set(); s.shop.forEach(x => { if (isObj(x) && typeof x.n === "string" && x.n && !seen.has(x.n)) { seen.add(x.n); out.shop.push({ n: x.n, from: typeof x.from === "string" ? x.from : "", b: !!x.b }); } }); }
  if (isObj(s.log)) for (const [k, v] of Object.entries(s.log)) { const d = strs(v, x => /^\d{4}-\d{2}-\d{2}$/.test(x) && !isNaN(Date.parse(x + "T00:00:00Z")) && new Date(x + "T00:00:00Z").toISOString().slice(0, 10) === x).sort(); /* 형식뿐 아니라 실제 있는 날짜만 */ if (okName(k) && d.length) out.log[k] = d; }
  if (isObj(s.rmemo)) for (const [k, v] of Object.entries(s.rmemo)) if (/^[a-z]{2,12}$/.test(k) && typeof v === "string" && v.trim()) out.rmemo[k] = v.slice(0, 1000);
  if (isObj(s.memo)) for (const [k, v] of Object.entries(s.memo)) if (okName(k) && typeof v === "string" && v.trim()) out.memo[k] = v.slice(0, 1000);
  if (Array.isArray(s.meal)) { const seen = new Set(); s.meal.forEach(x => { if (isObj(x) && typeof x.n === "string" && names.has(x.n) && !seen.has(x.n) && out.meal.length < 12) { seen.add(x.n); const p = Number(x.p); out.meal.push({ n: x.n, p: Number.isFinite(p) ? Math.min(5, Math.max(0.5, Math.round(p * 2) / 2)) : 1, on: x.on !== false }); } }); }
  if (Array.isArray(s.plan)) for (let i = 0; i < 7; i++) out.plan[i] = strs(s.plan[i], x => names.has(x));
  out.custom = out.custom.filter(c => { const k = SYN[c] || c; if (KNOWN.includes(k)) { if (!out.sel.includes(k)) out.sel.push(k); return false; } return true; });
  return out;
}

function toApp(msg){ try { const b = window.ReactNativeWebView; if (b && typeof b.postMessage === "function") { b.postMessage(JSON.stringify(msg)); return true; } } catch(e){} return false; }
function sendTheme(){
  try {
    const d = document.documentElement, t = d.getAttribute("data-theme");
    const dark = t === "dark" || (!t && !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches));
    const m = (getComputedStyle(document.body || d).backgroundColor || "").match(/\d+(\.\d+)?/g);
    if (!m || m.length < 3 || (m.length > 3 && +m[3] === 0)) return;
    toApp({ type: "theme", dark, bg: "#" + m.slice(0, 3).map(v => Math.round(+v).toString(16).padStart(2, "0")).join("") });
  } catch(e){}
}
function applyDisplay(){ const d = document.documentElement; d.setAttribute("data-fs", state.fs); if (state.theme === "auto") d.removeAttribute("data-theme"); else d.setAttribute("data-theme", state.theme); d.style.zoom = ZOOM[state.fs] === 1 ? "" : ZOOM[state.fs]; sendTheme(); }
try { const mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)"); if (mq) (mq.addEventListener ? mq.addEventListener("change", sendTheme) : mq.addListener(sendTheme)); } catch(e){}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function has(name){
  if (state.sel.includes(name)) return true;
  return state.custom.some(c => sameIng(name, canon(String(c).replace(/\s+/g, ""))));
}
const alOn = () => state.alnone ? [] : state.allergy;
const blocked = () => new Set(alOn().flatMap(a => ALLERGY[a] || []));
function subFor(n, mainOnly){
  const bl = blocked();
  for (const [expr, note, mainOk] of (SUB[n] || [])) {
    if (mainOnly && !mainOk) continue;
    const parts = expr.split("+");
    if (parts.every(p => has(p) && !bl.has(p))) return {expr: parts.join(", "), note};
  }
  return null;
}
function fitsAllergy(r){ const bl = blocked(); return !r.main.some(n => bl.has(n)); }
function match(r){
  const miss = [], subs = [];
  r.main.forEach(n => { if (has(n)) return; const sb = subFor(n, true); if (sb) subs.push([n, sb]); else miss.push(n); });
  const got = r.main.length - miss.length + r.opt.filter(has).length;
  return {r, miss, subs, got, seaMiss: r.sea.filter(n => !has(n))};
}
function fitsAge(r){
  if (state.age < r.age[0] || state.age > r.age[1]) return false;
  if (state.age === 0) { const [a, b] = bstOf(r); return state.bst >= a && state.bst <= b; }   // 이유식은 단계까지 맞아야
  return true;
}
/* 개인 맞춤: 싫어하는 재료, 조리 시간, 자주 먹는 요리 */
const disliked = n => state.dislike.some(d => { const c = canon(d); return n === c || sameIng(n, c); });
function fitsTaste(r){ return !r.main.some(disliked) && (!state.tmax || r.min <= state.tmax); }
function oftenScore(r){
  if (!state.often) return 0;
  const cnt = n => (state.log[n] || []).length + (state.fav.includes(n) ? 2 : 0);
  const top = RECIPES.map(x => [x, cnt(x.name)]).filter(([, c]) => c > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([x]) => x);
  const like = top.length ? r.main.filter(n => top.some(t => t !== r && t.main.includes(n))).length * 0.5 : 0;
  return cnt(r.name) + like;
}
function ranked(){
  const all = RECIPES.filter(r => fitsAge(r) && fitsAllergy(r) && fitsTaste(r)).map(match).map(m => (m.pref = oftenScore(m.r), m))
    .sort((a,b) => a.miss.length - b.miss.length || b.pref - a.pref || b.got - a.got || a.r.min - b.r.min);
  return {
    ready: all.filter(m => m.miss.length === 0),
    near: all.filter(m => m.miss.length > 0 && m.miss.length <= 2 && m.miss.length < m.r.main.length)
  };
}

function art(spec, seedStr){
  let h = 2166136261; for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
  const [v, base, tops] = spec;
  let R = 36, body = "";
  if (v === "pot") body = `<rect x="18" y="62" width="164" height="16" rx="8" fill="#1F2422"/><circle cx="100" cy="70" r="56" fill="#2A302D"/><circle cx="100" cy="70" r="47" fill="${base}"/>`;
  else if (v === "bowl") body = `<circle cx="100" cy="70" r="56" fill="#FFFFFF" stroke="#CFD8D4" stroke-width="2"/><circle cx="100" cy="70" r="46" fill="${base}"/>`;
  else if (v === "pan") body = `<rect x="140" y="62" width="62" height="14" rx="7" fill="#1F2422" transform="rotate(24 140 69)"/><circle cx="100" cy="70" r="55" fill="#2A302D"/><circle cx="100" cy="70" r="48" fill="${base}"/>`;
  else { R = 30; body = `<circle cx="100" cy="70" r="58" fill="#FFFFFF" stroke="#CFD8D4" stroke-width="2"/><circle cx="100" cy="70" r="46" fill="none" stroke="#E4EAE7" stroke-width="2"/><ellipse cx="100" cy="70" rx="40" ry="36" fill="${base}"/>`; }
  let t = "";
  for (const [shape, col, n] of tops){
    for (let i = 0; i < n; i++){
      const a = rnd() * 6.283, d = Math.sqrt(rnd()) * R, x = (100 + Math.cos(a) * d).toFixed(1), y = (70 + Math.sin(a) * d).toFixed(1), rot = Math.round(rnd() * 180);
      if (shape === "dot") t += `<circle cx="${x}" cy="${y}" r="3.4" fill="${col}"/>`;
      else if (shape === "cube") t += `<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2.5" fill="${col}" stroke="rgba(0,0,0,.12)" transform="rotate(${rot} ${x} ${y})"/>`;
      else if (shape === "slice") t += `<ellipse cx="${x}" cy="${y}" rx="9" ry="5" fill="${col}" stroke="rgba(0,0,0,.1)" transform="rotate(${rot} ${x} ${y})"/>`;
      else if (shape === "ring") t += `<circle cx="${x}" cy="${y}" r="3.6" fill="none" stroke="${col}" stroke-width="2.6"/>`;
      else if (shape === "strip") t += `<rect x="${x-11}" y="${y-2}" width="22" height="4" rx="2" fill="${col}" transform="rotate(${rot} ${x} ${y})"/>`;
      else if (shape === "zuc") t += `<circle cx="${x}" cy="${y}" r="9" fill="${col}" stroke="#6FA84E" stroke-width="2.5"/>`;
      else if (shape === "half") t += `<ellipse cx="${x}" cy="${y}" rx="8" ry="10" fill="#fff" stroke="rgba(0,0,0,.1)" transform="rotate(${rot} ${x} ${y})"/><circle cx="${x}" cy="${y}" r="4.5" fill="#F2B632"/>`;
      else if (shape === "egg") t += `<path d="M86 58c8-8 24-6 28 4s-2 22-14 22-22-14-14-26z" fill="#fff" stroke="rgba(0,0,0,.1)"/><circle cx="100" cy="70" r="7" fill="#F2B632"/>`;
      else if (shape === "rice") t += `<path d="M62 70a38 34 0 0 1 38-34v68a38 34 0 0 1-38-34z" fill="${col}"/>`;
    }
  }
  const p = PHOTO[seedStr];
  const img = p ? `<img alt="${esc(seedStr)} 사진" loading="lazy" referrerpolicy="no-referrer" src="${p[3] ? esc(p[3].u) : `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(p[0])}?width=640`}" onerror="this.closest('.pic').classList.add('nophoto');this.remove()">` : "";
  return `<span class="pic${p?"":" nophoto"}"><svg class="art" viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(seedStr)} 그림" style="background:color-mix(in srgb, ${base} 22%, var(--soft))">${body}${t}</svg>${img}</span>`;
}

const BASE_SERV = 2;
function niceNum(v, unit){
  if (/^(g|ml)/.test(unit)) return String(v >= 50 ? Math.round(v/5)*5 : Math.round(v));
  if (/^(kg|L)/.test(unit)) return String(Math.round(v*10)/10);
  if (Math.abs(v - Math.round(v)) < 0.02) return String(Math.round(v));
  if (v < 1){
    let best = [1,2], err = 9;
    for (const [n,d] of [[1,2],[1,3],[2,3],[1,4],[3,4],[1,6],[1,8]]) { const e = Math.abs(v - n/d); if (e < err) { err = e; best = [n,d]; } }
    return best[0] + "/" + best[1];
  }
  return String(Math.round(v*10)/10);
}
function scaleAmt(str, f){
  if (f === 1 || !str) return str;
  return str.replace(/(\d+(?:\.\d+)?)(?:\/(\d+))?/g, (m, a, b, off, all) => {
    const v = (b ? (+a / +b) : +a) * f;
    return niceNum(v, all.slice(off + m.length));
  });
}

function stepTime(text){
  let m = text.match(/(\d+)\s*~\s*(\d+)\s*분/); if (m) return [+m[2]*60, m[1]+"~"+m[2]+"분"];
  m = text.match(/(\d+)\s*분(?:\s*(\d+)\s*초)?/); if (m) return [+m[1]*60 + (m[2] ? +m[2] : 0), m[1]+"분" + (m[2] ? " "+m[2]+"초" : "")];
  m = text.match(/(\d+)\s*초/); if (m) return [+m[1], m[1]+"초"];
  return null;
}
let TIMERS = [], tick = null, actx = null;
function beep(){
  try { if (!actx) return; [0, .35, .7].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + .3); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .3); }); } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){}
}
function startTimer(sec, label){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e){}
  const t = { id: Date.now() + Math.random(), label, total: sec, end: Date.now() + sec*1000, left: sec, paused: false, done: false };
  TIMERS.push(t);
  toApp({ type: "timer:start", id: String(t.id), seconds: Math.round(sec), label: String(label || "요리 타이머") });   // 앱이면 화면을 꺼도 알림이 울리게
  if (!tick) tick = setInterval(renderTimers, 500);
  renderTimers();
}
const mmss = s => Math.floor(s/60) + ":" + String(Math.max(0, s%60)).padStart(2,"0");
function renderTimers(){
  const box = document.getElementById("timers");
  TIMERS.forEach(t => { if (!t.paused && !t.done) { t.left = Math.ceil((t.end - Date.now())/1000); if (t.left <= 0) { t.left = 0; t.done = true; beep(); } } });
  if (!TIMERS.length) { clearInterval(tick); tick = null; }
  document.body.classList.toggle("has-bar", !$bar.hidden);
  const extra = TIMERS.length * 64;
  document.documentElement.style.setProperty("--dock", extra + "px");
  box.innerHTML = TIMERS.map(t => `<div class="timer${t.done?" done":""}"><span class="t-l">${esc(t.label)}</span><span class="t-t">${t.done ? "다 됐어요" : mmss(t.left)}</span>
    ${t.done ? "" : `<button type="button" data-tpause="${t.id}">${t.paused ? "계속" : "멈춤"}</button>`}<button type="button" data-tclose="${t.id}" aria-label="타이머 닫기">${t.done ? "확인" : "취소"}</button>
    <i style="width:${(1 - t.left/t.total)*100}%"></i></div>`).join("");
}

}

let spinning = false;
function spinRand(){
  if (spinning) return;
  const {ready} = ranked(); if (!ready.length) return;
  const names = ready.map(m => m.r ? m.r.name : m.name);
  const pool = names.filter(n => n !== randName), from = pool.length ? pool : names;
  const target = from[Math.floor(Math.random() * from.length)];
  const finish = () => { randName = target; if (location.hash.replace("#","") === "recipes") { viewRecipes(); const bx = document.getElementById("randBox"); if (bx) bx.scrollIntoView({ block: "center" }); } };
  let reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}
  const bx = document.getElementById("randBox"), btn = bx && bx.querySelector("[data-rand]");
  if (!bx || !btn || reduce || names.length < 2) { finish(); return; }
  const old = bx.querySelector(".spin"); if (old) old.remove();
  const box = document.createElement("div"); box.className = "spin"; box.setAttribute("aria-hidden", "true");
  btn.after(box); btn.disabled = true; spinning = true;
  const seq = []; let last = "";
  for (let i = 0; i < 14; i++) { let c = names.filter(n => n !== last && n !== target); if (!c.length) c = names.filter(n => n !== last); if (!c.length) c = names; const n = c[Math.floor(Math.random() * c.length)]; seq.push(n); last = n; }
  seq.push(target);
  let i = 0;
  const step = () => {
    if (!box.isConnected) { spinning = false; return; }
    box.innerHTML = "<span>" + esc(seq[i]) + "</span>";
    if (i === seq.length - 1) { setTimeout(() => { spinning = false; finish(); }, 450); return; }
    const wait = 70 + Math.pow(i / (seq.length - 1), 2) * 260;
    i++; setTimeout(step, wait);
  };
  step();
}
